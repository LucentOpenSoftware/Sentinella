[package]
name = "sentinella-common"
description = "Shared constants, paths, and version info for the Sentinella AV suite"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

# EVENT_TRACE_PROPERTIES storage (etw_props module). Same windows-crate
# version as the rest of the workspace so the struct types unify; the crate
# stays dependency-free on non-Windows targets.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Diagnostics_Etw"] }
